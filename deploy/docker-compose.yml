# docker compose -f deploy/docker-compose.yml up -d
# Host networking keeps each user's real address for rate limits and bans
# (Docker's port proxy would make everyone look like one address).
services:
  vivant:
    image: ghcr.io/freecode100year/vivant:latest
    network_mode: host
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ulimits:
      core: 0
    environment:
      VIVANT_ADDR: ":2222"
      # VIVANT_ROOMS: "general:大厅,english:English"
    command: ["-max-per-ip", "3", "-idle-timeout", "1h"]
    volumes:
      - vivant-data:/data
    logging:
      driver: local
      options: { max-size: "5m", max-file: "2" }
volumes:
  vivant-data:
