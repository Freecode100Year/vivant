name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Known vulnerabilities (cargo audit)
        # fails when a dependency in Cargo.lock has a published advisory
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings

      - name: Test
        run: cargo test --locked

      - name: Shellcheck installer
        run: shellcheck -S warning install.sh deploy/make-offline-bundle.sh deploy/offline-header.sh

      - name: Unit file in sync with installer
        run: bash install.sh --print-unit | diff -u deploy/vivant.service -

  cross:
    # Static Linux binaries for the three release architectures, plus the
    # macOS and Windows builds, so a release can't fail on a platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, zig: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked --bin vivant --target ${{ matrix.target }}
            file target/${{ matrix.target }}/release/vivant | tee /dev/stderr | grep -q "statically linked"
          else
            cargo build --release --locked --bin vivant --target ${{ matrix.target }}
          fi
      - name: Runs
        if: matrix.target == 'x86_64-unknown-linux-musl' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: ./target/${{ matrix.target }}/release/vivant -version

  installer:
    # Real end-to-end run of install.sh on a systemd machine, using a local
    # "release" built from this commit.
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        # keep a log of every step for the diagnostics step below
        shell: bash -eo pipefail {0}
    steps:
      - run: mkdir -p /tmp/ci-logs

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - uses: mlugg/setup-zig@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build local release
        run: |
          exec > >(tee -a /tmp/ci-logs/build-local-release.log) 2>&1
          set -x
          mkdir -p /tmp/rel
          export VIVANT_VERSION=ci-${GITHUB_SHA::7}
          for t in x86_64-unknown-linux-musl:amd64 aarch64-unknown-linux-musl:arm64 armv7-unknown-linux-musleabihf:armv7; do
            cargo zigbuild --release --locked --bin vivant --target ${t%%:*}
            cp target/${t%%:*}/release/vivant /tmp/rel/vivant-linux-${t##*:}
          done
          (cd /tmp/rel && sha256sum vivant-linux-* > SHA256SUMS)
          (cd /tmp/rel && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1

      - name: Migrate from Private-Talk Terminal v0.8.1
        run: |
          exec > >(tee -a /tmp/ci-logs/migrate.log) 2>&1
          set -x
          # a real pre-rename install: released binary, onion service, persistent bans
          curl -fsSL -o /tmp/old-install.sh https://github.com/Freecode100Year/private-talk-terminal/releases/download/v0.8.1/install.sh
          sudo PTT_VERSION=v0.8.1 bash /tmp/old-install.sh --tor --persist-bans
          systemctl is-active --quiet ptterm
          fp_old=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')
          onion_old=$(sudo cat /var/lib/tor/ptterm/hostname)
          test -n "$fp_old" && test -n "$onion_old"
          # the new installer migrates it
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 bash install.sh
          systemctl is-active --quiet vivant
          if systemctl list-unit-files ptterm.service | grep -q ptterm.service; then echo "old unit left"; exit 1; fi
          test ! -e /usr/local/bin/ptterm && test ! -e /etc/ptterm.env && test ! -e /var/lib/tor/ptterm
          fp_new=$(ssh-keyscan -p 2222 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')
          test "$fp_old" = "$fp_new"                                          # no "host key changed" warning
          test "$(sudo cat /var/lib/tor/vivant/hostname)" = "$onion_old"      # same onion address
          grep -q '^VIVANT_BAN_FILE=/var/lib/vivant/bans.json' /etc/vivant.env
          grep -q '^VIVANT_ONION_ADDR=' /etc/vivant.env
          grep -q 'BEGIN vivant' /etc/tor/torrc
          if grep -q private-talk-terminal /etc/tor/torrc; then echo "old torrc block left"; exit 1; fi
          for _ in $(seq 1 20); do ss -ltn | grep -q '127.0.0.1:2224 ' && break; sleep 0.5; done
          out=$( (sleep 1; echo /quit) | ssh -T -p 2224 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 )
          echo "$out" | grep -q "Welcome"
          # the old management command still works
          sudo ptterm-ctl status > /tmp/st.txt
          grep -q "Version" /tmp/st.txt

      - name: Install
        run: |
          exec > >(tee -a /tmp/ci-logs/install.log) 2>&1
          set -x
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/vivant_admin
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 bash install.sh --admin-key ~/.ssh/vivant_admin.pub --domain localhost

      - name: Chat over SSH
        run: |
          exec > >(tee -a /tmp/ci-logs/chat-over-ssh.log) 2>&1
          set -x
          out=$( (sleep 2; echo "/nick ci-bot"; sleep 0.5; echo "hello from CI"; sleep 0.5; echo "/quit") \
            | ssh -T -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no guest@127.0.0.1 )
          echo "$out"
          echo "$out" | grep -q "<ci-bot> hello from CI"

      - name: Exec is refused
        run: |
          exec > >(tee -a /tmp/ci-logs/exec-is-refused.log) 2>&1
          set -x
          out=$(ssh -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o PubkeyAuthentication=no guest@127.0.0.1 id 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "only offers the chat room"

      - name: Client never sends a public key
        run: |
          exec > >(tee -a /tmp/ci-logs/no-key-offered.log) 2>&1
          set -x
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519   # a default key the client would normally offer
          log=$( (sleep 1; echo /quit) | ssh -v -T -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 2>&1 )
          echo "$log" | grep -E "Offering|Authenticated"
          echo "$log" | grep -q 'using "none"'
          if echo "$log" | grep -q "Offering public key"; then echo "client offered a key"; exit 1; fi

      - name: Tor onion service
        run: |
          exec > >(tee -a /tmp/ci-logs/tor.log) 2>&1
          set -x
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --tor
          onion=$(sudo cat /var/lib/tor/vivant/hostname)
          echo "$onion" | grep -Eq '^[a-z2-7]{56}\.onion$'
          sudo vivant-ctl status > /tmp/status.txt
          grep -q "Onion:" /tmp/status.txt
          # the local side of the onion service accepts chat sessions
          out=$( (sleep 1; echo /quit) | ssh -T -p 2224 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 )
          echo "$out" | grep -Eq "欢迎|Welcome"
          ss -ltn > /tmp/ss.txt
          grep -q '127.0.0.1:2224 ' /tmp/ss.txt

      - name: Alternate port 443
        run: |
          exec > >(tee -a /tmp/ci-logs/alt-port.log) 2>&1
          set -x
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --alt-port 443
          out=$( (sleep 1; echo /quit) | ssh -T -p 443 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 )
          echo "$out" | grep -Eq "欢迎|Welcome"
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --alt-port off
          ss -ltn > /tmp/ss.txt
          if grep -q ':443 ' /tmp/ss.txt; then echo "443 still open"; exit 1; fi

      - name: Persistent bans
        run: |
          exec > >(tee -a /tmp/ci-logs/persist-bans.log) 2>&1
          set -x
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --persist-bans
          sudo journalctl -u vivant -n 20 --no-pager > /tmp/j.txt
          grep -q "ban persistence enabled" /tmp/j.txt
          sudo test -f /var/lib/vivant/ban.key
          test "$(sudo stat -c %a /var/lib/vivant/ban.key)" = 600
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --no-persist-bans
          sudo test ! -e /var/lib/vivant/ban.key

      - name: Doctor
        run: |
          exec > >(tee -a /tmp/ci-logs/doctor.log) 2>&1
          set -x
          sudo vivant-ctl doctor --domain localhost
          # a stopped service and a Cloudflare-proxied name are reported as problems
          sudo systemctl stop vivant
          if sudo vivant-ctl doctor > /tmp/doc.txt; then cat /tmp/doc.txt; echo "doctor missed a stopped service"; exit 1; fi
          grep -q "service is" /tmp/doc.txt
          sudo systemctl start vivant
          echo "104.16.1.1 cf-proxied.test" | sudo tee -a /etc/hosts
          if sudo vivant-ctl doctor --domain cf-proxied.test > /tmp/doc.txt; then cat /tmp/doc.txt; echo "doctor missed the Cloudflare proxy"; exit 1; fi
          grep -q "grey cloud" /tmp/doc.txt

      - name: Status, reinstall, uninstall
        run: |
          exec > >(tee -a /tmp/ci-logs/status-reinstall-uninstall.log) 2>&1
          set -x
          sudo vivant-ctl status
          sudo VIVANT_DOWNLOAD_BASE=http://127.0.0.1:8765 vivant-ctl install --port 2299
          ss -ltn > /tmp/ss.txt
          grep -q ':2299 ' /tmp/ss.txt
          sudo vivant-ctl uninstall --purge
          if grep -q "BEGIN vivant" /etc/tor/torrc; then echo "torrc not cleaned"; exit 1; fi
          test ! -e /var/lib/tor/vivant
          if systemctl is-active --quiet vivant; then echo "still running"; exit 1; fi
          test ! -e /usr/local/bin/vivant

      - name: Offline one-click install
        run: |
          exec > >(tee -a /tmp/ci-logs/offline.log) 2>&1
          set -x
          cp install.sh /tmp/rel/
          bundle=$(deploy/make-offline-bundle.sh /tmp/rel ci)
          # any download attempt would go to a dead proxy and fail the install
          dead="https_proxy=http://127.0.0.1:9 http_proxy=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 HTTP_PROXY=http://127.0.0.1:9"
          sudo env $dead bash "$bundle" --port 2233 > /tmp/off.txt 2>&1 || { cat /tmp/off.txt; exit 1; }
          cat /tmp/off.txt
          grep -q "离线安装" /tmp/off.txt
          systemctl is-active --quiet vivant
          out=$( (sleep 1; echo /quit) | ssh -T -p 2233 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null guest@127.0.0.1 )
          echo "$out" | grep -q "Welcome"
          test -x /usr/local/sbin/vivant-ctl
          # --to: deploy over SSH to "another" server (this one, via a localhost
          # sshd) as a non-root user, so the remote side goes through sudo
          sudo apt-get install -y -q openssh-server >/dev/null
          sudo systemctl start ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/deploy_key
          cat ~/.ssh/deploy_key.pub >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          printf 'Host target\n  HostName 127.0.0.1\n  Port 22\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          env $dead bash "$bundle" --to "$USER@target" --port 2244 --rooms "general:大厅 Lobby,tech:it's 技术" < /dev/null > /tmp/to.txt 2>&1 || { cat /tmp/to.txt; exit 1; }
          cat /tmp/to.txt
          for _ in $(seq 1 20); do ss -ltn | grep -q ':2244 ' && break; sleep 0.5; done
          grep -q "^VIVANT_ROOMS=general:大厅 Lobby,tech:it's 技术" /etc/vivant.env
          # a damaged bundle is refused before anything is unpacked
          cp "$bundle" /tmp/bad.sh
          printf 'X' | dd of=/tmp/bad.sh bs=1 seek=$(( $(stat -c %s /tmp/bad.sh) - 100 )) conv=notrunc
          if sudo bash /tmp/bad.sh > /tmp/bad.txt 2>&1; then cat /tmp/bad.txt; echo "damaged bundle installed"; exit 1; fi
          grep -q "checksum mismatch" /tmp/bad.txt
          sudo vivant-ctl uninstall --purge

      - name: Diagnostics
        if: failure()
        run: |
          # Surface logs as annotations (readable via the checks API).
          enc() { sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' -e 's/\r/%0D/g'; }
          for f in /tmp/ci-logs/*.log; do
            echo "::error title=$(basename "$f")::$(tail -n 40 "$f" | enc)"
          done
          echo "::error title=journal::$(sudo journalctl -u vivant -n 40 --no-pager 2>&1 | enc)"
          echo "::error title=systemctl::$(systemctl status vivant --no-pager 2>&1 | tail -n 20 | enc)"

  docker:
    # The container image builds, runs as non-root on a read-only root
    # filesystem, and serves the chat.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --build-arg VERSION=ci -t vivant:ci .

      - name: Run and chat
        run: |
          set -x
          docker run -d --name vivant --network host --read-only --cap-drop ALL \
            --security-opt no-new-privileges -v vivant-data:/data -e VIVANT_ADDR=:2290 vivant:ci
          for _ in $(seq 1 30); do ss -ltn | grep -q ':2290 ' && break; sleep 0.5; done
          out=$( (sleep 1; echo "/nick dock"; sleep 0.5; echo "hi from docker"; sleep 0.5; echo /quit) \
            | ssh -T -p 2290 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null en@127.0.0.1 )
          echo "$out"
          echo "$out" | grep -q "Welcome"
          echo "$out" | grep -q "<dock> hi from docker"
          test "$(docker exec vivant /usr/local/bin/vivant -version)" = "vivant ci"
          # the host key lands in the volume and survives a restart
          fp1=$(ssh-keyscan -p 2290 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')
          docker restart vivant
          for _ in $(seq 1 30); do ss -ltn | grep -q ':2290 ' && break; sleep 0.5; done
          sleep 1
          fp2=$(ssh-keyscan -p 2290 127.0.0.1 2>/dev/null | ssh-keygen -lf - | awk '{print $2}')
          test -n "$fp1" && test "$fp1" = "$fp2"

      - name: Logs
        if: always()
        run: docker logs vivant 2>&1 | tail -50 || true
