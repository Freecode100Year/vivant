name: Release

# Two ways to publish:
#   • push a tag vX.Y.Z, or
#   • bump the VERSION file on main — a release vX.Y.Z is created if it
#     doesn't exist yet.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [VERSION]

permissions:
  contents: write
  packages: write   # container image on ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            V="$GITHUB_REF_NAME"
          else
            V="v$(tr -d ' \n' < VERSION)"
          fi
          [[ "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "bad version $V"; exit 1; }
          if gh release view "$V" >/dev/null 2>&1; then
            echo "release $V already exists — nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.v.outputs.skip != 'true'

      - name: Test
        if: steps.v.outputs.skip != 'true'
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit --deny warnings
          cargo test --locked

  build:
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, name: vivant-linux-amd64, zig: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, name: vivant-linux-arm64, zig: true }
          - { os: ubuntu-latest, target: armv7-unknown-linux-musleabihf, name: vivant-linux-armv7, zig: true }
          # Windows / macOS: plain binaries for local testing and LANs (no installer)
          - { os: macos-latest, target: x86_64-apple-darwin, name: vivant-macos-amd64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: vivant-macos-arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: vivant-windows-amd64.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, name: vivant-windows-arm64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - name: Build
        shell: bash
        env:
          VIVANT_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -e
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked --bin vivant --target ${{ matrix.target }}
          else
            cargo build --release --locked --bin vivant --target ${{ matrix.target }}
          fi
          mkdir -p out
          src=target/${{ matrix.target }}/release/vivant
          [ -f "$src.exe" ] && src=$src.exe
          cp "$src" "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/${{ matrix.name }}
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.skip != 'true'
    uses: ./.github/workflows/android.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  publish:
    needs: [version, build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -e
          chmod 0755 dist/vivant-*
          # same binaries under the pre-rename names, so "ptterm-ctl upgrade" on
          # servers that haven't migrated yet keeps working
          for a in amd64 arm64 armv7; do cp dist/vivant-linux-$a dist/ptterm-linux-$a; done
          cp install.sh dist/
          deploy/make-offline-bundle.sh dist "$V"
          (cd dist && sha256sum vivant-* ptterm-linux-* install.sh > SHA256SUMS && cat SHA256SUMS)
          test "$(./dist/vivant-linux-amd64 -version)" = "vivant $V"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: |
          cat > notes.md <<'EOF'
          ## 一键安装 · One-line install

          ```bash
          curl -fsSL https://raw.githubusercontent.com/Freecode100Year/vivant/main/install.sh | sudo bash
          ```

          已安装的服务器升级 · Upgrade an existing server: `sudo vivant-ctl upgrade`

          从 Private-Talk Terminal（ptterm）迁移：运行上面的一键命令即可，主机密钥、配置、封禁、洋葱地址都会保留。
          Migrating from Private-Talk Terminal (ptterm): run the command above; host key, config, bans and onion address are kept.

          离线一键安装（服务器连不上 GitHub）· Offline one-click install (server can't reach GitHub): download `vivant-<version>-linux-offline.sh`, then either `bash vivant-<version>-linux-offline.sh --to root@SERVER` from your computer, or copy it over and run `sudo bash vivant-<version>-linux-offline.sh` on the server.

          Windows / macOS：`vivant-windows-*.exe`、`vivant-macos-*` 只适合本机测试或局域网，没有安装器、沙箱和开机自启 · for local testing or a LAN only — no installer, sandbox or autostart.

          安卓手机当服务器 · Android phone as a server: `vivant-android.apk`（Android 8+，见 [docs/android.md](https://github.com/Freecode100Year/vivant/blob/main/docs/android.md) · see [docs/android.en.md](https://github.com/Freecode100Year/vivant/blob/main/docs/android.en.md)）

          程序 Binaries: `vivant-linux-amd64` (x86_64), `vivant-linux-arm64` (ARM64, e.g. Oracle Ampere), `vivant-linux-armv7`；用 `SHA256SUMS` 校验 · verify with `SHA256SUMS`. (`ptterm-linux-*` are the same files under the old names.)
          EOF
          # --latest: a release from main is always the current one, even when an
          # abandoned tag (v0.10.0) has a higher version number.
          gh release create "$V" dist/* --target "$GITHUB_SHA" --title "$V" --notes-file notes.md --generate-notes --latest

  image:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Anonymous chat room over SSH
            org.opencontainers.image.licenses=MIT
