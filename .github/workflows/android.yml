name: Android

# Builds the Android APKs: the Rust server and the frp client cross-compiled
# from source with the NDK, plus Tor (tor-android, as in Orbot), packed into a
# small app that runs them as a foreground service.
# 构建安卓 APK（手机上运行的 VIVANT 服务器 + Tor 洋葱服务 / frp）。
#
# Stable signing (so updates install over each other): add the repository
# secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks), ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and optionally ANDROID_KEY_PASSWORD. Without them the APKs
# are signed with a throwaway debug key.
on:
  push:
    branches: [main, android]
    paths: ["android/**", "src/**", "Cargo.toml", "Cargo.lock", "VERSION", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "src/**", "Cargo.toml", "Cargo.lock", ".github/workflows/android.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  frpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: grep -E "^[A-Z_]+=" android/tunnels.env >> "$GITHUB_ENV"
      - name: Source
        run: git clone -q --depth 1 --branch "$FRP_VERSION" https://github.com/fatedier/frp android/.tunnel-src/frp
      - uses: actions/setup-go@v6
        with:
          go-version-file: android/.tunnel-src/frp/go.mod
          cache-dependency-path: android/.tunnel-src/frp/go.sum
      - name: Build
        run: |
          set -o pipefail
          android/build-tunnels.sh frpc 2>&1 | tee build.log
          file android/app/src/main/jniLibs/*/libfrpc.so
      - name: Report failure
        if: failure()
        run: .github/report-failure.sh build.log
      - uses: actions/upload-artifact@v4
        with:
          name: frpc
          path: android/app/src/main/jniLibs/
          if-no-files-found: error

  apk:
    needs: frpc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # tor-android's classes are Java 24 bytecode
          java-version: "25"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Version
        run: |
          V="${{ inputs.version }}"
          [ -n "$V" ] || V="v$(tr -d ' \n' < VERSION)"
          echo "VIVANT_VERSION=$V" >> "$GITHUB_ENV"

      - name: Server for Android (NDK)
        run: |
          set -o pipefail
          android/build-native.sh 2>&1 | tee build.log

      - name: Tunnel clients
        uses: actions/download-artifact@v4
        with:
          path: tunnels

      - name: Collect native programs
        run: |
          set -e
          J=android/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp tunnels/frpc/$abi/libfrpc.so $J/$abi/
          done
          ls -l $J/*

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"

      - name: Signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — APKs are debug-signed"
            exit 0
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "VIVANT_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "VIVANT_KEYSTORE_PASSWORD=$KS_PASS"
            echo "VIVANT_KEY_ALIAS=$KEY_ALIAS"
            echo "VIVANT_KEY_PASSWORD=${KEY_PASS:-$KS_PASS}"
          } >> "$GITHUB_ENV"

      - name: APK
        run: |
          set -o pipefail
          gradle -p android --no-daemon assembleRelease 2>&1 | tee build.log
          d=android/app/build/outputs/apk/release
          mkdir -p out
          cp $d/app-universal-release.apk out/vivant-android.apk
          cp $d/app-arm64-v8a-release.apk out/vivant-android-arm64.apk
          cp $d/app-armeabi-v7a-release.apk out/vivant-android-armv7.apk
          cp $d/app-x86_64-release.apk out/vivant-android-x86_64.apk
          for f in libvivant.so libfrpc.so libtor.so; do
            for abi in arm64-v8a armeabi-v7a x86_64; do
              unzip -l out/vivant-android.apk | grep -q "lib/$abi/$f" || { echo "missing $abi/$f"; exit 1; }
            done
            unzip -l out/vivant-android-arm64.apk | grep -q "lib/arm64-v8a/$f" || { echo "arm64 apk missing $f"; exit 1; }
          done
          ls -l out

      - name: Report failure
        if: failure()
        run: .github/report-failure.sh build.log

      - uses: actions/upload-artifact@v4
        with:
          name: vivant-android-apks
          path: out/*.apk
          if-no-files-found: error
