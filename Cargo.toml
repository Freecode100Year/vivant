[package]
name = "vivant"
version = "0.0.0" # the real version comes from the VERSION file / VIVANT_VERSION at build time
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Anonymous chat room over SSH"
repository = "https://github.com/Freecode100Year/vivant"
publish = false

[[bin]]
name = "vivant"
path = "src/main.rs"

[[bin]]
name = "vivant-bench"
path = "src/bin/vivant-bench.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "signal", "io-util"] }
russh = { version = "0.65", default-features = false, features = ["ring"] }
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = { version = "0.10", features = ["case-insensitive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-general-category = "1.1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

# Android's own allocator is fine (and mimalloc's TLS setup doesn't suit bionic)
[target.'cfg(not(target_os = "android"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
